  known_fails: [P3] # every check ID that is still FAIL or ERROR, explained in lab-report.md §9.1, e.g. [T6, E4]

assumptions:
  # AC1 allows a booking to end at 1440 (24:00). A time input usually stops at 23:59.
  # Decide what YOUR final page does, declare it, defend it in lab-report.md §9.2.
  # Any answer is acceptable. Not deciding is not.
  end_of_day: not-expressible # typed-24:00 | end-of-day-option | minutes-input | not-expressible

review_findings:
