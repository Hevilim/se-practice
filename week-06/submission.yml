  # v1, or a file in prototype/.
  # Worthless:        "Bolt made some mistakes"
  # Worth everything: "T8: v1's Check button pushed the request into bookings, so the second check said Unavailable (AC5)"
  - "v1: no room had only the booking 10:00-11:00, so T1-T9 were Not testable; Bolt fixed it by changing the sample data of Auditorium B in src/App.tsx (AC4)"
  - "T3: on v1 the blocked Innovation Lab had a booking 08:00-20:00, so the blocked reason was mixed with an overlap reason (AC3)"
  - "T6, T7: v1 said Invalid input instead of Unavailable; fixed in evaluateBooking and ResultCard in src/App.tsx (AC5, AC6)"
  - "v1 and final, prototype/project/package.json: Bolt said it removed @supabase/supabase-js, but the download still has it on line 14 (scope, check P3)"

honesty:
