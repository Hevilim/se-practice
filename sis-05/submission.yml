honesty:
  baseline_unchanged: yes       # yes | no   project/ at the baseline commit is the project as it was
  review_was_read_only: yes     # yes | no   the Task 4 review modified nothing
  runs_unedited: yes            # yes | no   every output in report.md is pasted from a real run
  no_secrets_or_personal_data: yes # yes | no   nothing real in sis-05/
  ai_usage_disclosed: yes       # yes | no   AI_USAGE.md and section 11 are complete
