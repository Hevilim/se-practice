# week-11/submission.yml — your declaration for this lab.
#
# Facts only. Every explanation goes in lab-report.md; nothing here repeats prose.
# Fill every value. Check it before you push:
#
#     python tests/validate_submission.py
#
# The validator checks shape, never quality. A green run is the floor, not the grade.
# If you cannot run Python, fill the file by hand against the comments — a malformed
# file costs you nothing if the content is there.

schema: 1
week: "11"

student:
  name:
  student_id:          # as in KBTU records, e.g. 00X000000
  github:              # your GitHub username, the one that owns the repo

assistant:
  tool:                # the assistant that built the feature: Bolt.new, Claude Code, Cursor, ...
  model:               # its exact model with its version, or: not displayed
  environment:         # bolt | claude-code | cursor | copilot | chat | other

reviewer:
  tool:                # the assistant that reviewed in Task 6
  model:               # its exact model with its version, or: not displayed
  same_model_as_builder: # yes | no

project:
  starting_point:      # week-10 | week-08
  baseline_commit:     # the checkpoint of Part 0: git rev-parse --short HEAD after "baseline from week 10"
  language:            # ts | js   the language of your booking and explain modules
  vitest:              # the Vitest version from the "RUN  v..." line, e.g. 3.2.4

feature:
  adapter:             # mock | mock-and-server   (server = a real model behind your own server, optional)
  timeout_ms:          # the timeout explainAvailability uses
  prompt_chosen:       # A | B | C   from lab-report.md §5.4

counts:
  tests_baseline:      # the total of the §2.2 run
  tests_final:         # the total of the §8.3 run
  cases_run:           # rows E1-E9 in §6.1 with verdict pass or fail
  findings_verified:   # rows in §7.3
  findings_confirmed:  # of those, how many are confirmed

decision:
  fixed: []            # the two finding IDs you fixed in §8, e.g. [V1, V2]
  demo_ready:          # yes | no   from §8.4

checker:
  # Numbers from YOUR last run of: python tests/check_feature.py
  # They must add up to the number of checks it runs (27).
  # Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing extra. A hidden one costs the criterion.
  pass:
  fail:
  error:
  commit:              # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)
  known_fails: []      # every check ID that is still FAIL or ERROR, explained in lab-report.md §9, e.g. [E2]

review_findings:
  # Three or more. One line each, and each one names what it is about: a finding ID (V1...),
  # a test case (E1-E9), a criterion (F1-F5, AC1-AC6), a reason code, or a file.
  # Worthless:        "The reviewer found some issues that were not real"
  # Worth everything: "V3: the reviewer said roomLabel allows prompt injection; App.tsx takes it from a fixed list - unsupported"
  -
  -
  -

honesty:
  changes_reviewed_by_me:        # yes | no   every changed file in §4.2 decided by you
  no_key_in_browser:             # yes | no   no key, token or provider call in app/src/
  review_was_read_only:          # yes | no   the Task 6 review edited nothing
  outputs_unedited:              # yes | no   every run in lab-report.md is pasted from a real terminal
  ai_usage_disclosed:            # yes | no   AI_USAGE.md is complete
